name: Scientific figure validation

on:
  push:
    branches: ["feature/**", "main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run validation tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: Generate all synthetic templates
        env:
          MPLBACKEND: Agg
        run: |
          python examples/run_all.py --out /tmp/figure-generated
          test "$(find /tmp/figure-generated -name '*.png' | wc -l)" -eq 4
          test "$(find /tmp/figure-generated -name '*.pdf' | wc -l)" -eq 4
          test "$(find /tmp/figure-generated -name '*.svg' | wc -l)" -eq 4
          test "$(find /tmp/figure-generated -name '*.manifest.json' | wc -l)" -eq 4
      - name: Generate legacy case-study adapters for review
        env:
          MPLBACKEND: Agg
        run: |
          python examples/migrate_legacy.py --out /tmp/legacy-generated
          test "$(find /tmp/legacy-generated -name '*.png' | wc -l)" -eq 3
          test "$(find /tmp/legacy-generated -name '*.pdf' | wc -l)" -eq 3
          test "$(find /tmp/legacy-generated -name '*.svg' | wc -l)" -eq 3
      - name: Archive publication-format review figures
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: figure-review-python312
          path: |
            /tmp/figure-generated/
            /tmp/legacy-generated/
          retention-days: 14
