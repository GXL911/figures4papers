[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figures4papers"
version = "0.1.0"
description = "Reproducible scientific figure generation and validation, extending the figures4papers case-study repository."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scipy>=1.10", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
legacy = ["seaborn>=0.13", "python-dateutil>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
